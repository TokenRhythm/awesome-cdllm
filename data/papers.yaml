# Paper list of awesome-cdllm. One record per paper; README.md is generated from this file.
# Field reference and scope rules: CONTRIBUTING.md. Categories: data/categories.yaml.

# ---------------------------------------------------------------- surveys
- id: yu2026latent
  name: The Latent Space
  title: 'The Latent Space: Foundation, Evolution, Mechanism, Ability, and Outlook'
  authors: Xinlei Yu, Zhangquan Chen, Yongbo He, Tianyu Fu, Guanting Dong, Cheng Yang, Chengming Xu, Yue Ma, Xiaobin Hu, Zhe Cao, Jie Xu, Guibin Zhang, Jiale Tao, Jiayi Zhang, Siyuan Ma, Kaituo Feng, Haojie Huang, Youxing Li, Ronghao Chen, Huacan Wang, Chenglin Wu, Zikun Su, Xiaogang Xu, Kelu Yao, Kun Wang, Chen Gao, Yue Liao, Ruqi Huang, Tao Jin, Zhucun Xue, Cheng Tan, Jiangning Zhang, Wenqi Ren, Yanwei Fu, Yong Liu, Yu Wang, Xiangyu Yue, Yu-Gang Jiang, Shuicheng Yan
  venue: arXiv
  date: 2026-04
  paper: https://arxiv.org/abs/2604.02029
  code: xlyu0106/Awesome-Latent-Space
  category: surveys
  summary: Examines latent-space computation in language-based models, organizing reasoning, planning, and memory work by mechanism and capability across Foundation, Evolution, Mechanism, Ability, and Outlook perspectives.
- id: dieleman2026continuous
  title: Continuous diffusion language models
  authors: Sander Dieleman
  venue: Blog
  date: '2026'
  paper: https://sander.ai/2026/08/24/continuous-dlms.html
  category: surveys
  summary: Synthesizes in a blog post the case for revisiting continuous diffusion language models, covering embeddings, losses, schedules, self-conditioning, and distillability.
- id: li2025survey
  title: A Survey on Diffusion Language Models
  authors: Tianyi Li, Mingda Chen, Bowei Guo, Zhiqiang Shen
  venue: arXiv
  date: 2025-08
  paper: https://arxiv.org/abs/2508.10875
  code: VILA-Lab/Awesome-DLMs
  category: surveys
  summary: Traces the diffusion language model landscape, centering on discrete diffusion while devoting one chronological section to continuous models from Diffusion-LM to ELF, Cola, and BitLM.
- id: yu2025discretesurvey
  title: 'Discrete Diffusion in Large Language and Multimodal Models: A Survey'
  authors: Runpeng Yu, Qi Li, Xinchao Wang
  venue: TMLR 2026
  date: 2025-06
  paper: https://openreview.net/forum?id=0DsqnkP8Cp
  code: LiQiiiii/DLLM-Survey
  category: surveys
  summary: Restricts its survey to discrete diffusion large language and multimodal models, reviewing their parallel multi-token decoding with full attention and denoising-based generation.
- id: yi2024textdiffusionsurvey
  title: 'Diffusion models in text generation: a survey'
  authors: Qiuhua Yi, Xiangfan Chen, Chenwei Zhang, Zehai Zhou, Linan Zhu, Xiangjie Kong
  venue: PeerJ Computer Science 2024
  date: '2024'
  paper: https://doi.org/10.7717/peerj-cs.1905
  category: surveys
  summary: Organizes diffusion models for text generation by downstream task, covering conditional generation, unconstrained generation, and fine-grained control.
- id: zou2023survey
  title: A Survey of Diffusion Models in Natural Language Processing
  authors: Hao Zou, Zae Myung Kim, Dongyeop Kang
  venue: arXiv
  date: 2023-05
  paper: https://arxiv.org/abs/2305.14671
  category: surveys
  summary: Reviews diffusion models across natural language processing, contrasting discrete and continuous formulations, comparing them with autoregressive models, and cataloging applications.
- id: li2023diffusion
  title: 'Diffusion Models for Non-autoregressive Text Generation: A Survey'
  authors: Yifan Li, Kun Zhou, Wayne Xin Zhao, Ji-Rong Wen
  venue: IJCAI 2023
  date: 2023-03
  paper: https://arxiv.org/abs/2303.06574
  code: RUCAIBox/Awesome-Text-Diffusion-Models
  category: surveys
  summary: Surveys diffusion models for non-autoregressive text generation, separating discrete from continuous formulations and reviewing diffusion-process design and pretrained language model integration.

# ---------------------------------------------------------------- foundations
- id: geng2025mean
  name: MeanFlow
  title: Mean Flows for One-step Generative Modeling
  authors: Zhengyang Geng, Mingyang Deng, Xingjian Bai, J. Zico Kolter, Kaiming He
  venue: NeurIPS 2025
  date: 2025-05
  paper: https://proceedings.neurips.cc/paper_files/paper/2025/hash/6d13e085b79d454da5910e4ca82a3d9d-Abstract-Conference.html
  code: Gsunshine/meanflow
  category: foundations
  summary: Models the average velocity over an interval through its Eulerian identity with the instantaneous velocity for one-step generation, a parameterization DiLaDiff adopts to distill latent text velocities.
- id: boffi2024flowmap
  name: Flow Map Matching
  title: 'Flow Map Matching with Stochastic Interpolants: A Mathematical Framework for Consistency Models'
  authors: Nicholas M. Boffi, Michael S. Albergo, Eric Vanden-Eijnden
  venue: TMLR 2025
  date: 2024-06
  paper: https://openreview.net/forum?id=cqDH0e6ak2
  category: foundations
  summary: Frames consistency models as learning the two-time flow map of a stochastic-interpolant model, by distillation or direct training, with an average velocity obeying a Lagrangian identity.
- id: stark2024dirichlet
  name: Dirichlet FM
  title: Dirichlet Flow Matching with Applications to DNA Sequence Design
  authors: Hannes Stark, Bowen Jing, Chenyu Wang, Gabriele Corso, Bonnie Berger, Regina Barzilay, Tommi Jaakkola
  venue: ICML 2024
  date: 2024-02
  paper: https://proceedings.mlr.press/v235/stark24b.html
  code: HannesStark/dirichlet-flow-matching
  category: foundations
  summary: Transports points on the probability simplex toward vertices along Dirichlet paths with posterior-weighted conditional fields, demonstrated on DNA sequence design and reused as simplex-path geometry by text models.
- id: yin2024dmd
  name: DMD
  title: One-step Diffusion with Distribution Matching Distillation
  authors: Tianwei Yin, Michaël Gharbi, Richard Zhang, Eli Shechtman, Frédo Durand, William T. Freeman, Taesung Park
  venue: CVPR 2024
  date: 2023-11
  paper: https://openaccess.thecvf.com/content/CVPR2024/html/Yin_One-step_Diffusion_with_Distribution_Matching_Distillation_CVPR_2024_paper.html
  category: foundations
  summary: Matches a one- or few-step student to a diffusion teacher in distribution at every noise level using score differences, a distillation family DLM-One instantiates for continuous text.
- id: song2023consistency
  name: Consistency Models
  title: Consistency Models
  authors: Yang Song, Prafulla Dhariwal, Mark Chen, Ilya Sutskever
  venue: ICML 2023
  date: 2023-03
  paper: https://proceedings.mlr.press/v202/song23a.html
  code: openai/consistency_models
  category: foundations
  summary: Maps every point along one trajectory to the same endpoint, the endpoint case of a flow map, enabling one-step generation via distillation or standalone training.
- id: albergo2023interpolants
  name: Stochastic Interpolants
  title: 'Stochastic Interpolants: A Unifying Framework for Flows and Diffusions'
  authors: Michael S. Albergo, Nicholas M. Boffi, Eric Vanden-Eijnden
  venue: JMLR 2025
  date: 2023-03
  paper: https://jmlr.org/papers/v26/23-1605.html
  category: foundations
  summary: Unifies flows and diffusions by bridging two densities with a stochastic interpolant path plus an optional latent noise term, covering both deterministic and stochastic generative models.
- id: dpmsolverpp2022
  name: DPM-Solver++
  title: 'DPM-Solver++: Fast Solver for Guided Sampling of Diffusion Probabilistic Models'
  authors: Cheng Lu, Yuhao Zhou, Fan Bao, Jianfei Chen, Chongxuan Li, Jun Zhu
  venue: Mach. Intell. Res. 2025
  date: 2022-11
  paper: https://arxiv.org/abs/2211.01095
  code: LuChengTHU/dpm-solver
  category: foundations
  summary: Solves the diffusion ODE by integrating its linear part exactly in log signal-to-noise ratio and approximating the clean-state prediction with a low-order polynomial, reducing to DDIM at first order.
- id: lipman2023flow
  name: Flow Matching
  title: Flow Matching for Generative Modeling
  authors: Yaron Lipman, Ricky T. Q. Chen, Heli Ben-Hamu, Maximilian Nickel, Matt Le
  venue: ICLR 2023
  date: 2022-10
  paper: https://openreview.net/forum?id=PqvMRDCJT9t
  code: facebookresearch/flow_matching
  category: foundations
  summary: Regresses velocity fields of fixed conditional probability paths to train continuous normalizing flows simulation-free, with the same parameter gradient as regression on the marginal velocity.
- id: rectifiedflow2022
  name: Rectified Flow
  title: 'Flow Straight and Fast: Learning to Generate and Transfer Data with Rectified Flow'
  authors: Xingchao Liu, Chengyue Gong, Qiang Liu
  venue: ICLR 2023
  date: 2022-09
  paper: https://openreview.net/forum?id=XVjTT1nw5z
  code: gnobitab/RectifiedFlow
  category: foundations
  summary: Performs flow matching with the linear interpolant and adds a reflow step that re-pairs noise and data along the learned coupling to straighten trajectories.
- id: cfg2022
  name: CFG
  title: Classifier-Free Diffusion Guidance
  authors: Jonathan Ho, Tim Salimans
  venue: arXiv
  date: 2022-07
  paper: https://arxiv.org/abs/2207.12598
  category: foundations
  summary: Guides diffusion sampling without an external classifier by training with the condition randomly dropped and extrapolating conditional and unconditional estimates.
- id: salimans2022progressive
  name: Progressive Distillation
  title: Progressive Distillation for Fast Sampling of Diffusion Models
  authors: Tim Salimans, Jonathan Ho
  venue: ICLR 2022
  date: 2022-02
  paper: https://openreview.net/forum?id=TIdIXIpzhoI
  category: foundations
  summary: Distills a many-step deterministic diffusion sampler by repeatedly halving its step count, and introduces the v-parameterization that avoids dividing by a vanishing signal coefficient.
- id: rombach2022high
  name: LDM
  title: High-Resolution Image Synthesis with Latent Diffusion Models
  authors: Robin Rombach, Andreas Blattmann, Dominik Lorenz, Patrick Esser, Björn Ommer
  venue: CVPR 2022
  date: 2021-12
  paper: https://openaccess.thecvf.com/content/CVPR2022/html/Rombach_High-Resolution_Image_Synthesis_With_Latent_Diffusion_Models_CVPR_2022_paper.html
  code: CompVis/latent-diffusion
  category: foundations
  summary: Moves image diffusion into the latent space of a pretrained autoencoder, supplying the encoder–generator–decoder decomposition that latent text codec systems later borrow.
- id: song2021score
  name: Score SDE
  title: Score-Based Generative Modeling through Stochastic Differential Equations
  authors: Yang Song, Jascha Sohl-Dickstein, Diederik P. Kingma, Abhishek Kumar, Stefano Ermon, Ben Poole
  venue: ICLR 2021
  date: 2020-11
  paper: https://openreview.net/forum?id=PxTIG12RRHS
  code: yang-song/score_sde
  category: foundations
  summary: Reverses a noise-injecting SDE using the learned time-dependent score and derives a probability-flow ODE that shares every time-marginal with the reverse-time SDE.
- id: ddim2021
  name: DDIM
  title: Denoising Diffusion Implicit Models
  authors: Jiaming Song, Chenlin Meng, Stefano Ermon
  venue: ICLR 2021
  date: 2020-10
  paper: https://openreview.net/forum?id=St1giarCHLP
  code: ermongroup/ddim
  category: foundations
  summary: Replaces the Markovian forward process of DDPM with non-Markovian ones sharing its training objective, giving a deterministic sampler that re-forms each state from the predicted clean state and noise.
- id: ddpm2020
  name: DDPM
  title: Denoising Diffusion Probabilistic Models
  authors: Jonathan Ho, Ajay Jain, Pieter Abbeel
  venue: NeurIPS 2020
  date: 2020-06
  paper: https://proceedings.neurips.cc/paper_files/paper/2020/hash/4c5bcfec8584af0d967f1ab10179ca4b-Abstract.html
  code: hojonathanho/diffusion
  category: foundations
  summary: Introduces denoising diffusion probabilistic models trained on a weighted variational bound, sampling ancestrally from the Gaussian forward posterior evaluated at the predicted clean state.

